spring.application.name=tuneful
server.port=${PORT:8080}

spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=3600

# Caffeine cache: results live ~10 min, plenty for chart browsing
spring.cache.type=caffeine
spring.cache.cache-names=search,artist,track,similarArtists,topTracks,appleChart,deezerChart
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

logging.level.org.springframework.web=INFO
logging.level.com.example.musicapp=INFO
